name: LoopCtrl
options:
  bundleIdPrefix: top.ebato
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

# Team and bundle-id prefix come from here, not from this file: each developer
# has their own (see Config/Signing.xcconfig and Scripts/setup-signing.sh).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  LoopCtrl:
    type: application
    platform: iOS
    sources:
      - path: LoopCtrlApp
        excludes:
          - AllInOne-Info.plist
      - path: LoopCtrlKit
      # Shared with the runner: one string table for both processes, so a phrase
      # the user sees in a notification matches the one in the app.
      - path: LoopCtrlUITests/Localized.swift

    dependencies:
      # idevice (MIT) — the lockdown/RSD/image-mounter client that does the
      # actual DDI mount and on-device pairing. Built from source by
      # Scripts/build-idevice.sh with Patches/idevice applied, not committed.
      - framework: Frameworks/IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOOPCTRL_BUNDLE_PREFIX).loopctrl"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LoopCtrl pairs with this device from Settings, reaches its debug service through LocalDevVPN or Shadowrocket to mount the Developer Disk Image, and serves the automation API on your network."
        # LSApplicationQueriesSchemes can't be expressed as an INFOPLIST_KEY_
        # setting — Xcode only maps an allowlist of keys and drops this one
        # silently — so it lives in a real plist that gets merged in. Without it
        # iOS denies UIApplication.open() for these schemes with no error, which
        # would break the Start button and the StikDebug shortcut.
        INFOPLIST_FILE: LoopCtrlApp/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "LoopCtrl uses the camera only to scan a remote service connection invite (QR code)."

  # SPIKE (docs/runner-merge-spike.md): LoopCtrl and the runner as ONE app. The
  # main executable is LoopCtrl's own, so it launches with no DDI; the test bundle
  # rides along in PlugIns/ and InProcessRunner dlopens XCTest after the mount.
  LoopCtrlAllInOne:
    type: application
    platform: iOS
    sources:
      - path: LoopCtrlApp
        excludes:
          - Info.plist
          - AllInOne-Info.plist
      - path: LoopCtrlKit
      - path: LoopCtrlUITests/Localized.swift
    dependencies:
      - framework: Frameworks/IDevice.xcframework
        embed: false
      - target: LoopCtrlUITests
        embed: true
        codeSign: true
        copy:
          destination: plugins
      # The remote-control Live Activity (docs/remote-control.md, "Control").
      - target: LoopCtrlLiveActivity
        embed: true
        codeSign: true
      # The system broadcast (docs/remote-control.md, "System broadcast").
      - target: LoopCtrlBroadcast
        embed: true
        codeSign: true
    settings:
      base:
        # Its own product name: the LoopCtrl target still gets built (the UI test
        # target depends on it), and two LoopCtrl.app outputs collide.
        PRODUCT_NAME: LoopCtrlAllInOne
        INFOPLIST_KEY_CFBundleDisplayName: "$(LOOPCTRL_DISPLAY_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOOPCTRL_BUNDLE_PREFIX).loopctrl$(LOOPCTRL_BUNDLE_SUFFIX)"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LoopCtrl pairs with this device from Settings, reaches its debug service through LocalDevVPN or Shadowrocket to mount the Developer Disk Image, and serves the automation API on your network."
        INFOPLIST_FILE: LoopCtrlApp/AllInOne-Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "LoopCtrl uses the camera only to scan a remote service connection invite (QR code)."
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOOPCTRL_ALL_IN_ONE"
        # XCTRunner's own LC_RPATHs. Nothing is linked through them at launch
        # (the app does not link XCTest), so a missing DDI costs nothing; they
        # resolve the test bundle's @rpath/XCTest.framework and
        # @rpath/libXCTestSwiftSupport.dylib once the image is mounted.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks /System/Developer/Library/Frameworks /System/Developer/usr/lib /Developer/Library/Frameworks /Developer/usr/lib"

  LoopCtrlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoopCtrlUITests
      - path: LoopCtrlKit
      # The operating manual, bundled so GET /skill can serve it at runtime.
      - path: SKILL.md
        buildPhase: resources
      # The reference client, served at GET /skill/examples/python so a caller
      # can download a working v1-envelope implementation straight off the
      # device instead of writing the crypto itself.
      - path: Scripts/loopctrl_rpc.py
        buildPhase: resources
      # Static aarch64-musl CLI, served at GET /skill/examples/cli. Built for
      # the Minis sandbox (Alpine arm64), whose minirootfs has no python3 — the
      # reference client there would cost an `apk add` before the first call.
      # Rebuild with `make -C cli build` (Docker or zig) and commit it.
      - path: cli/loopctrl
        buildPhase: resources
      - path: cli/loopctrl.sh
        buildPhase: resources
      # License texts for the bundled CLI (musl) and the app's libraries.
      - path: LoopCtrlApp/ThirdPartyNotices.txt
        buildPhase: resources
      # The Live Activity's state, which the runner starts and updates.
      - path: LoopCtrlLiveActivity/RemoteActivityAttributes.swift
    dependencies:
      - target: LoopCtrl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOOPCTRL_BUNDLE_PREFIX).loopctrl.uitests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: LoopCtrlUITests/XCTestPrivate-Bridging-Header.h
        # The server runs in THIS (runner) process, so the runner is the app that
        # needs Local Network access. Declared here so the permission prompt has a
        # rationale (raised via a LAN touch only when on Wi-Fi and remote is
        # unreachable — skipped on cellular).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LoopCtrl needs local network access to serve the automation API on your LAN."
        TEST_HOST: ""
    postBuildScripts:
      - name: "Strip unnecessary XCTest frameworks"
        script: |
          RUNNER_APP="${BUILT_PRODUCTS_DIR}/LoopCtrlUITests-Runner.app"
          echo "🔧 Stripping XCTest frameworks from Runner.app..."
          rm -rf "${RUNNER_APP}/Frameworks/XCTAutomationSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTest.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestCore.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUIAutomation.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUnit.framework"
          rm -rf "${RUNNER_APP}/Frameworks/Testing.framework"
          rm -f  "${RUNNER_APP}/Frameworks/libXCTestSwiftSupport.dylib"
          rmdir  "${RUNNER_APP}/Frameworks" 2>/dev/null || true
          echo "✅ Frameworks stripped"

  # The remote-control Live Activity: who is watching and operating, with
  # Pause / Resume, on the Lock Screen and in the Dynamic Island. Embedded in
  # the all-in-one app only: there the runner shares the app's process, which
  # is what may start a Live Activity and what the buttons' intents run in.
  # The system broadcast: iOS hands it the screen as it is drawn, and it
  # passes the encoded frames to the runner over loopback. Embedded in the
  # all-in-one app only, where the switch that turns it on lives.
  LoopCtrlBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: LoopCtrlBroadcast
        excludes:
          - Info.plist
      - path: LoopCtrlKit/BroadcastWire.swift
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOOPCTRL_BUNDLE_PREFIX).loopctrl$(LOOPCTRL_BUNDLE_SUFFIX).broadcast"
        INFOPLIST_FILE: LoopCtrlBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(LOOPCTRL_DISPLAY_NAME)"
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  LoopCtrlLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: LoopCtrlLiveActivity
        excludes:
          - Info.plist
      - path: LoopCtrlApp/LiveActivity/RemoteActivityIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOOPCTRL_BUNDLE_PREFIX).loopctrl$(LOOPCTRL_BUNDLE_SUFFIX).live"
        INFOPLIST_FILE: LoopCtrlLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(LOOPCTRL_DISPLAY_NAME)"
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Logic tests for LoopCtrlKit code that needs nothing from iOS (pairing
  # request bookkeeping, remote service invites and connection state, the
  # relay tunnel's framing and the screen stream's sealing). macOS, so they run without a simulator or device:
  #   xcodebuild test -scheme LoopCtrlKitTests -destination platform=macOS
  LoopCtrlKitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LoopCtrlKit/PairRequestLedger.swift
      - path: LoopCtrlKit/RemoteInvite.swift
      - path: LoopCtrlKit/RemoteService.swift
      - path: LoopCtrlKit/SecureEnvelope.swift
      - path: LoopCtrlKit/ScreenStreamWire.swift
      - path: LoopCtrlKit/TunnelFrame.swift
      - path: LoopCtrlKit/PageUpdate.swift
      - path: LoopCtrlKit/BuildStamp.swift
      - path: LoopCtrlKit/RemoteHTML.swift
      - path: LoopCtrlKit/AppNameMatch.swift
      - path: LoopCtrlKit/RemoteSession.swift
      - path: LoopCtrlKit/RPCTypes.swift
      - path: LoopCtrlKit/AuthManager.swift
      - path: LoopCtrlKit/KeychainStore.swift
      - path: LoopCtrlKit/TokenFileStore.swift
      - path: LoopCtrlKit/BroadcastWire.swift
      - path: Tests/LoopCtrlKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "top.ebato.loopctrl.kittests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  LoopCtrlAllInOne:
    build:
      targets:
        LoopCtrlAllInOne: all
  LoopCtrl:
    build:
      targets:
        LoopCtrl: all
        LoopCtrlUITests: [test]
    test:
      targets:
        - LoopCtrlUITests
      testPlans: []
      # testStartServer is one test that runs for hours and always ends killed,
      # i.e. "failed" — so XCTest's default screen recording (30fps H.264 in
      # testmanagerd's tmp, kept on failure) piled up as tens of GB of "System
      # Data" on the phone. The server takes its own frames; record nothing.
      preferredScreenCaptureFormat: screenshots
      captureScreenshotsAutomatically: false
  LoopCtrlKitTests:
    build:
      targets:
        LoopCtrlKitTests: [test]
    test:
      targets:
        - LoopCtrlKitTests
