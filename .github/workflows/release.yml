name: Release

# Builds unsigned IPAs on a GitHub-hosted macOS runner and attaches them to a
# GitHub release. Unsigned means no team, no provisioning profile and no device
# UDIDs: whoever installs the package re-signs it (SideStore, sign-ipa.sh, or
# Xcode), which replaces the signature anyway.
#
# Trigger it from the Actions tab, or by pushing a tag like v0.1-beta.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1-beta
        required: true
        default: v0.1-beta
      version:
        description: MARKETING_VERSION written into the bundles
        required: true
        default: "0.1.0"
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # macOS 26 is GA and ships Xcode 26.x, which is the first that can compile
    # the Icon Composer document (LoopCtrlApp/AppIcon.icon) into Assets.car.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            version="$INPUT_VERSION"
          else
            tag="$REF_NAME"
            # v0.1-beta -> 0.1.0: the bundle version must stay numeric.
            base="$(printf '%s' "$tag" | sed -E 's/^v//; s/-.*$//')"
            case "$base" in
              *.*.*) version="$base" ;;
              *.*)   version="$base.0" ;;
              *)     version="$base.0.0" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $tag as MARKETING_VERSION=$version"

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          rustc --version || true
          # Captured here, not in the release step: xcodebuild aborts with a
          # broken-pipe exception when its output is piped into something that
          # exits early (`head`).
          echo "xcode=$(xcodebuild -version | sed -n 's/^Xcode //p')" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          rustup target list --installed | grep aarch64-apple-ios

      # Config/Local.xcconfig is gitignored and normally created by
      # Scripts/setup-signing.sh from a developer certificate. The unsigned
      # build needs neither a team nor a certificate, so an empty file is
      # enough — Config/Signing.xcconfig already carries the neutral prefix.
      - name: Stub out the per-developer signing file
        run: |
          printf '// CI: unsigned build, no team.\nDEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
          cat Config/Local.xcconfig

      # idevice is built from source with Patches/idevice applied (several
      # minutes). Cache it keyed on the patch contents; build-idevice.sh skips
      # the build when the cached .version stamp still matches.
      - name: Cache the patched idevice xcframework
        uses: actions/cache@v4
        with:
          path: Frameworks/IDevice.xcframework
          key: idevice-${{ runner.os }}-${{ hashFiles('Patches/idevice/*.patch', 'Scripts/build-idevice.sh') }}

      - name: Build unsigned IPAs
        env:
          SETTINGS: >-
            MARKETING_VERSION=${{ steps.meta.outputs.version }}
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
        run: |
          make ipa UNSIGNED=1 EXTRA_BUILD_SETTINGS="$SETTINGS"
          make ipa-allinone UNSIGNED=1 EXTRA_BUILD_SETTINGS="$SETTINGS"
          Scripts/package-release.sh

      - name: Verify the packages
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          for ipa in release/LoopCtrl-AllInOne.ipa release/LoopCtrl.ipa release/LoopCtrlUITests-Runner.ipa; do
            echo "== $ipa"
            unzip -q "$ipa" -d "$work/$(basename "$ipa" .ipa)"
          done
          app="$work/LoopCtrl-AllInOne/Payload/LoopCtrlAllInOne.app"
          echo "bundle id : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          echo "version   : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"))"
          test -d "$app/PlugIns/LoopCtrlUITests.xctest" || { echo "runner missing"; exit 1; }
          test -f "$app/PlugIns/LoopCtrlUITests.xctest/loopctrl" || { echo "cli missing"; exit 1; }
          if find "$work" -name embedded.mobileprovision | grep -q .; then
            echo "a provisioning profile survived"; exit 1
          fi
          echo "ok"

      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.ipa | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: loopctrl-${{ steps.meta.outputs.tag }}
          path: |
            release/*.ipa
            release/SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode }}
        run: |
          set -euo pipefail

          # Re-running replaces the release, so a failed or partial upload never
          # leaves half a set behind.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          cat > notes.md <<EOF
          Unsigned IPAs, built from \`${GITHUB_SHA:0:7}\` by GitHub Actions with
          Xcode ${XCODE_VERSION}.

          Bundle version \`$VERSION\` (build $GITHUB_RUN_NUMBER).

          ### Install

          1. Download **\`LoopCtrl-AllInOne.ipa\`** — one app that contains both the
             UI and the automation runner. It replaces an older LoopCtrl install.
          2. Re-sign and install it: SideStore (My Apps → +), or on a Mac
             \`Scripts/sign-ipa.sh -i LoopCtrl-AllInOne.ipa\`.
          3. Trust the certificate under Settings → General → VPN & Device Management.
          4. Open LoopCtrl → mount the Developer Disk Image → **Start**.
             The first start asks for your passcode and for Notifications and
             Local Network access.

          \`LoopCtrl.ipa\` + \`LoopCtrlUITests-Runner.ipa\` are the two-app build.
          Use it only if you want to drive the runner from Xcode/a Mac; it costs
          two sideloading slots instead of one.

          Nothing here is signed, so iOS will not install it as-is. Every package
          carries no provisioning profile, no team id and no device identifiers.

          See [README.md](../blob/main/README.md) for the API, clients and the
          \`SKILL.md\` the phone serves at \`/skill\`.
          EOF

          args=(--title "LoopCtrl $TAG" --notes-file notes.md --target "$GITHUB_SHA")
          args+=(release/*.ipa release/SHA256SUMS.txt)
          if [ "$PRERELEASE" != "false" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
