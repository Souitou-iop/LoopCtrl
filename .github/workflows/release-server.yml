# Tag server-vX.Y.Z to run the server checks (server.yml) and publish
# ghcr.io/<owner>/loopctrl-relay:X.Y.Z, :X.Y and :latest for linux/amd64 and
# linux/arm64.
name: Release server

on:
  push:
    tags: ["server-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/server.yml

  image:
    name: Publish the relay image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and version
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loopctrl-relay" >> "$GITHUB_OUTPUT"
          # server-v1.2.3 → v1.2.3 for the semver tags below
          echo "version=${GITHUB_REF_NAME#server-}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.name.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.name.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: server/connect/relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
