# Tag vX.Y[.Z][-suffix] (v0.2-beta) to build the unsigned LoopCtrl.ipa
# (app.yml) and attach it to a GitHub release. A release ships that one
# package only; the older two-app build (make ipa-twoapp) stays a
# build-from-source option. The Actions tab can also run it for any tag.
name: Release app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1-beta
        required: true
      version:
        description: MARKETING_VERSION written into the bundles; empty derives it from the tag
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "$VERSION" ]; then
            # v0.1-beta -> 0.1.0: the bundle version must stay numeric.
            base="$(printf '%s' "$TAG" | sed -E 's/^v//; s/-.*$//')"
            case "$base" in
              *.*.*) VERSION="$base" ;;
              *.*)   VERSION="$base.0" ;;
              *)     VERSION="$base.0.0" ;;
            esac
          fi
          # A pushed tag is a pre-release when it has a suffix.
          if [ -z "$PRERELEASE" ]; then
            case "$TAG" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG as MARKETING_VERSION=$VERSION (pre-release: $PRERELEASE)"

  build:
    needs: meta
    uses: ./.github/workflows/app.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      artifact: loopctrl-${{ needs.meta.outputs.tag }}

  publish:
    name: Publish
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: loopctrl-${{ needs.meta.outputs.tag }}
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          XCODE_VERSION: ${{ needs.build.outputs.xcode }}
        run: |
          set -euo pipefail

          # Re-running replaces the release, so a failed or partial upload never
          # leaves half a set behind.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          cat > notes.md <<EOF
          Unsigned IPA, built from \`${GITHUB_SHA:0:7}\` by GitHub Actions with
          Xcode ${XCODE_VERSION}.

          Bundle version \`$VERSION\` (build $GITHUB_RUN_NUMBER).

          $(sed '/^<!--/,/^-->/d' .github/RELEASE_NOTES_TEMPLATE.md)
          EOF

          args=(--title "LoopCtrl $TAG" --notes-file notes.md --target "$GITHUB_SHA")
          args+=(release/LoopCtrl.ipa release/SHA256SUMS.txt)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
