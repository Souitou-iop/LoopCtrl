# /etc/nginx/conf.d/RELAY_DOMAIN.conf: the relay on a name of its own
# (LOOPCTRL_RELAY_PUBLIC_SERVER=RELAY_DOMAIN), with each phone at
# <slug>.PHONES_DOMAIN (LOOPCTRL_RELAY_DEVICE_DOMAIN=PHONES_DOMAIN).
#
# Certificates: RELAY_DOMAIN as usual; *.PHONES_DOMAIN needs a DNS-01
# challenge, e.g. certbot certonly --dns-<provider> -d '*.PHONES_DOMAIN'.
# The two may be one name: RELAY_DOMAIN=relay.example.com and
# PHONES_DOMAIN=relay.example.com, with one certificate for both.

map $http_upgrade $loopctrl_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN *.PHONES_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name RELAY_DOMAIN *.PHONES_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/RELAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # Phones hold their tunnel as a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $loopctrl_connection;
        # The relay routes on the name a browser asked for.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The screen is a long streamed response: pass it on as it comes.
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 32m;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
