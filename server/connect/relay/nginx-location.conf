# Put the relay under a path of an existing HTTPS server block, e.g.
# https://example.com/loopctrl-relay/  (LOOPCTRL_RELAY_PUBLIC_SERVER=example.com/loopctrl-relay).
# Phones are then at https://example.com/loopctrl-relay/d/<slug>/remote.
# The trailing slashes matter: /loopctrl-relay/v1/... reaches the relay as /v1/...
#
# Needs, at http level (once per nginx):
#   map $http_upgrade $loopctrl_connection { default upgrade; '' close; }
location /loopctrl-relay/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    # Phones hold their tunnel as a WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $loopctrl_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The screen is a long streamed response: pass it on as it comes.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 32m;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
