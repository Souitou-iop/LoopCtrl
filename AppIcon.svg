<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- LoopCtrl app icon source. Full-bleed square: iOS applies the corner mask.
       Rendered by generate_icon.py (rsvg-convert). Concept: a closed loop-arrow
       (the phone looping back to itself) around a pointer that taps the screen
       (the phone controlling itself). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2446"/>
      <stop offset="100%" stop-color="#080a16"/>
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="840" y1="180" x2="180" y2="840">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#2b7bff"/>
      <stop offset="100%" stop-color="#7a3cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2b7bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background (no rounded corners, no transparency) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="url(#halo)"/>

  <!-- Loop: ~290 degree arc that closes back on itself with an arrowhead -->
  <path d="M 797.6 572.7 A 292 292 0 1 1 658.0 259.1" fill="none" stroke="url(#loop)"
        stroke-width="100" stroke-linecap="round"/>
  <path d="M 701.1 170.9 L 754.1 348.7 L 606.1 342.3 Z" fill="url(#loop)"
        stroke="url(#loop)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Tap ripple at the pointer tip -->
  <circle cx="440" cy="368" r="70" fill="none" stroke="#00e5ff" stroke-width="16" opacity="0.5"/>
  <circle cx="440" cy="368" r="36" fill="#00e5ff"/>

  <!-- Pointer -->
  <path d="M 440.0 368.0 L 440.0 634.6 L 505.1 575.7 L 548.5 671.8 L 595.0 651.7 L 553.1 558.6 L 635.3 558.6 Z" fill="#ffffff" stroke="#0b0e1f" stroke-width="22" stroke-linejoin="round" paint-order="stroke"/>
</svg>
