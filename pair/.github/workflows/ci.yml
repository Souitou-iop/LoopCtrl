# Build, test and package LoopCtrl Pair. Pushes to main and pull requests
# run the checks and build every bundle; a v* tag also publishes a GitHub
# release with the bundles attached (pre-release when the tag has a "-").
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # What Tauri needs on Debian/Ubuntu to build (the .deb then depends on the
  # runtime parts). Linux ships as .deb and CLI only: no AppImage, which would
  # bundle GTK/WebKitGTK (LGPL).
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: UI (type check and build)
        run: bun run check && bun run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: CLI against the mock backend
        run: |
          cargo build -p loopctrl-pair-cli --locked
          B=target/debug/loopctrl-pair D=$RUNNER_TEMP/pair
          $B --version
          $B devices --mock --json --data-dir $D
          $B pair --mock --json --timeout 120 --data-dir $D --out $D/out.plist | tail -n 1
          $B write --mock --data-dir $D
          $B verify --mock --json --data-dir $D
          test -s $D/out.plist
          # Built-in usbmuxd on a real Linux kernel: starts, serves its socket,
          # sees no iPhone.
          $B env --mux builtin --data-dir $D || test $? -eq 3
          $B devices --mux builtin --json --data-dir $D
      - name: Licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Not the action's default --all-features: the Android bridge's
          # "cli" feature is a build tool (uniffi-bindgen) that never ships;
          # deny.toml sets all-features = false.
          arguments: --workspace
          command: check licenses bans sources
      - name: Advisories (informational)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          arguments: --workspace
          command: check advisories
      - name: Licenses (JS)
        run: bun run licenses:check
      - name: Third-party notices are up to date
        run: bun run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md ui/src/lib/licenses.json

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Desktop app (.deb)
        run: bun tauri build --bundles deb
      - name: CLI
        run: cargo build --release --locked -p loopctrl-pair-cli
      - name: Collect
        run: |
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="pair-core") | .version')
          mkdir -p out cli/loopctrl-pair-$V-linux-${{ matrix.arch }}
          cp target/release/bundle/deb/*.deb out/LoopCtrl-Pair-$V-linux-${{ matrix.deb }}.deb
          d=cli/loopctrl-pair-$V-linux-${{ matrix.arch }}
          cp target/release/loopctrl-pair packaging/linux/70-loopctrl-pair.rules LICENSE THIRD_PARTY_NOTICES.md $d/
          tar -C cli -czf out/loopctrl-pair-cli-$V-linux-${{ matrix.arch }}.tar.gz $(basename $d)
          dpkg-deb --info out/*.deb | sed -n '1,30p'
          dpkg-deb --contents out/*.deb | grep -E 'udev|bin/'
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Desktop app (.dmg, unsigned)
        run: bun tauri build --target universal-apple-darwin --bundles app,dmg
      - name: CLI
        run: |
          cargo build --release --locked -p loopctrl-pair-cli --target aarch64-apple-darwin
          cargo build --release --locked -p loopctrl-pair-cli --target x86_64-apple-darwin
          lipo -create -output loopctrl-pair target/aarch64-apple-darwin/release/loopctrl-pair target/x86_64-apple-darwin/release/loopctrl-pair
      - name: Collect
        run: |
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="pair-core") | .version')
          mkdir -p out cli/loopctrl-pair-$V-macos-universal
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/LoopCtrl-Pair-$V-macos-universal.dmg
          cp loopctrl-pair LICENSE THIRD_PARTY_NOTICES.md cli/loopctrl-pair-$V-macos-universal/
          tar -C cli -czf out/loopctrl-pair-cli-$V-macos-universal.tar.gz loopctrl-pair-$V-macos-universal
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: cargo test --locked -p pair-core -p pair-host -p usbmux -p loopctrl-pair-cli
      - name: Desktop app (NSIS installer, unsigned)
        run: bun tauri build --bundles nsis
      - name: CLI
        run: cargo build --release --locked -p loopctrl-pair-cli
      - name: Collect
        shell: bash
        run: |
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="pair-core") | .version')
          mkdir -p out cli
          cp target/release/bundle/nsis/*.exe out/LoopCtrl-Pair-$V-windows-x64-setup.exe
          cp target/release/loopctrl-pair.exe LICENSE THIRD_PARTY_NOTICES.md cli/
          (cd cli && 7z a ../out/loopctrl-pair-cli-$V-windows-x64.zip .)
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    name: Android (debug APK)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build and unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Collect
        run: |
          V=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="pair-core") | .version')
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/LoopCtrl-Pair-$V-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -l
          tag="$GITHUB_REF_NAME"
          pre=""; case "$tag" in *-*) pre="--prerelease";; esac
          notes=../docs/release-notes/$tag.md
          if [ -f "$notes" ]; then n="--notes-file $notes"; else n="--generate-notes"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" * --clobber
          else
            gh release create "$tag" * $pre $n --title "LoopCtrl Pair $tag"
          fi
