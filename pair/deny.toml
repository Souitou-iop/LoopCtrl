# cargo deny check — licenses, bans, sources. Run: cargo deny check
[graph]
# What we ship: macOS (Intel, Apple Silicon) and Windows.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = false

[licenses]
# Permissive only. No GPL, AGPL or LGPL (an "OR LGPL" choice is fine: we take
# the permissive side).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: fine for unmodified dependencies in a
# commercial app, but only for these, which come with Tauri itself.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # GPL/LGPL device stacks must never come in, even through a feature.
  { name = "rusb" },
  { name = "libusb1-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# The advisory DB needs network access; run `cargo deny check advisories` in CI.
ignore = []
