[workspace]
resolver = "2"
members = ["crates/pair-core", "crates/usbmux", "crates/pair-host", "crates/cli", "src-tauri", "android/bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Souitou-iop/LoopCtrl-Pair"
rust-version = "1.85"

[workspace.dependencies]
pair-core = { path = "crates/pair-core" }
pair-host = { path = "crates/pair-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
plist = "1.8"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
